name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  version-bump:
    name: Bump version in source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch _BASE_VERSION in main.py
        run: |
          sed -i 's/_BASE_VERSION = ".*"/_BASE_VERSION = "${{ steps.vars.outputs.version }}"/' app/main.py

      - name: Inject release entry into metainfo.xml
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s|<releases>|<releases>\n    <release version=\"${VERSION}\" date=\"${DATE}\"/>|" \
            data/io.github.todevelopers.GseProfiler.metainfo.xml

      - name: Commit and re-tag
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/main.py data/io.github.todevelopers.GseProfiler.metainfo.xml
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bump version to ${{ steps.vars.outputs.version }} [skip ci]"
            git push origin main
            git tag -f "$GITHUB_REF_NAME" HEAD
            git push -f origin "$GITHUB_REF_NAME"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.tarball.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version-bump.outputs.sha }}

      - name: Build source tarball
        id: tarball
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="gse-profiler-${VERSION}/" \
            -o "gse-profiler-${VERSION}.tar.gz" \
            HEAD
          SHA256=$(sha256sum "gse-profiler-${VERSION}.tar.gz" | awk '{print $1}')
          echo "TARBALL=gse-profiler-${VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          # Pull the section for this version: from "## [VERSION]" up to (but not including) the next "## [" heading.
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > CHANGELOG.txt
          else
            # Fallback: commit list since previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              git log --oneline "${PREV_TAG}..HEAD" > CHANGELOG.txt
            else
              git log --oneline HEAD > CHANGELOG.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version-bump.outputs.version }}"
          name: "GSE Profiler ${{ needs.version-bump.outputs.version }}"
          body_path: CHANGELOG.txt
          files: ${{ env.TARBALL }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: [version-bump, release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Flatpak manifest source URL and sha256
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          SHA256="${{ needs.release.outputs.sha256 }}"
          sed -i \
            "s|releases/download/v[0-9.]*/gse-profiler-[0-9.]*.tar.gz|releases/download/v${VERSION}/gse-profiler-${VERSION}.tar.gz|" \
            build-aux/io.github.todevelopers.GseProfiler.yml
          sed -i \
            "s|sha256: .*|sha256: ${SHA256}|" \
            build-aux/io.github.todevelopers.GseProfiler.yml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet build-aux/io.github.todevelopers.GseProfiler.yml; then
            git add build-aux/io.github.todevelopers.GseProfiler.yml
            git commit -m "chore: update Flatpak manifest to v${{ needs.version-bump.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Flathub and install GNOME runtime (user)
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak bundle
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          flatpak-builder \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=repo \
            flatpak_app \
            build-aux/io.github.todevelopers.GseProfiler.yml
          flatpak build-bundle repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "gse-profiler-${VERSION}-x86_64.flatpak" \
            io.github.todevelopers.GseProfiler

      - name: Install org.flatpak.Builder for lint
        run: flatpak --user install -y flathub org.flatpak.Builder

      - name: Lint manifest
        continue-on-error: true
        run: >
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder
          manifest build-aux/io.github.todevelopers.GseProfiler.yml

      - name: Lint repo
        continue-on-error: true
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Attach Flatpak bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version-bump.outputs.version }}"
          files: "gse-profiler-${{ needs.version-bump.outputs.version }}-x86_64.flatpak"
