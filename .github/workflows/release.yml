name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  version-bump:
    name: Bump version in source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Patch _BASE_VERSION in main.py
        run: |
          sed -i 's/_BASE_VERSION = ".*"/_BASE_VERSION = "${{ steps.vars.outputs.version }}"/' app/main.py

      - name: Inject release entry into metainfo.xml
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          VERSION="$VERSION" DATE="$DATE" python3 - <<'PYEOF'
          import os, re

          VERSION = os.environ['VERSION']
          DATE    = os.environ['DATE']

          with open('CHANGELOG.md', encoding='utf-8') as f:
              content = f.read()

          # Extract the ## [VERSION] section (everything up to next ## [ heading)
          pattern = rf'^## \[{re.escape(VERSION)}\][^\n]*\n(.*?)(?=^## \[|\Z)'
          m = re.search(pattern, content, re.MULTILINE | re.DOTALL)

          def clean(text):
              """Strip markdown inline markup so AppStream gets plain text."""
              text = re.sub(r'\*\*(.+?)\*\*', r'\1', text)
              text = re.sub(r'\*(.+?)\*',     r'\1', text)
              text = re.sub(r'`(.+?)`',       r'\1', text)
              return text.strip()

          def flush_items(items, parts):
              if items:
                  parts.append('        <ul>')
                  for it in items:
                      parts.append(f'          <li>{clean(it)}</li>')
                  parts.append('        </ul>')
              return []

          if not m:
              entry = f'    <release version="{VERSION}" date="{DATE}"/>'
          else:
              parts, items = [], []
              for line in m.group(1).split('\n'):
                  line = line.rstrip()
                  if line.startswith('### '):
                      items = flush_items(items, parts)
                      parts.append(f'        <p>{line[4:].strip()}:</p>')
                  elif line.startswith(('- ', '* ')):
                      items.append(line[2:])
                  elif line and not line.startswith('#'):
                      items = flush_items(items, parts)
                      parts.append(f'        <p>{clean(line)}</p>')
              flush_items(items, parts)

              if not parts:
                  entry = f'    <release version="{VERSION}" date="{DATE}"/>'
              else:
                  desc = '\n'.join(['      <description>'] + parts + ['      </description>'])
                  entry = (
                      f'    <release version="{VERSION}" date="{DATE}">\n'
                      f'{desc}\n'
                      f'    </release>'
                  )

          with open('data/io.github.todevelopers.GseProfiler.metainfo.xml', encoding='utf-8') as f:
              xml_doc = f.read()

          if f'version="{VERSION}"' in xml_doc:
              print(f'Release {VERSION} already in metainfo.xml, skipping')
          else:
              xml_doc = xml_doc.replace('<releases>', f'<releases>\n{entry}', 1)
              with open('data/io.github.todevelopers.GseProfiler.metainfo.xml', 'w', encoding='utf-8') as f:
                  f.write(xml_doc)
              print(f'Injected release {VERSION} ({DATE})')
          PYEOF

      - name: Commit and re-tag
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/main.py data/io.github.todevelopers.GseProfiler.metainfo.xml
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bump version to ${{ steps.vars.outputs.version }} [skip ci]"
            git push origin main
            git tag -f "$GITHUB_REF_NAME" HEAD
            git push -f origin "$GITHUB_REF_NAME"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: version-bump
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.tarball.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version-bump.outputs.sha }}

      - name: Build source tarball
        id: tarball
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="gseprofiler-${VERSION}/" \
            -o "gseprofiler-${VERSION}.tar.gz" \
            HEAD
          SHA256=$(sha256sum "gseprofiler-${VERSION}.tar.gz" | awk '{print $1}')
          echo "TARBALL=gseprofiler-${VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          # Pull the section for this version: from "## [VERSION]" up to (but not including) the next "## [" heading.
          if [[ -f CHANGELOG.md ]] && grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            awk -v ver="${VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > CHANGELOG.txt
          else
            # Fallback: commit list since previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "$PREV_TAG" ]]; then
              git log --oneline "${PREV_TAG}..HEAD" > CHANGELOG.txt
            else
              git log --oneline HEAD > CHANGELOG.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version-bump.outputs.version }}"
          name: "GSE Profiler ${{ needs.version-bump.outputs.version }}"
          body_path: CHANGELOG.txt
          files: ${{ env.TARBALL }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: [version-bump, release]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Flatpak manifest source URL and sha256
        run: |
          export VERSION="${{ needs.version-bump.outputs.version }}"
          export SHA256="${{ needs.release.outputs.sha256 }}"
          python3 - <<'PYEOF'
          import re, os
          VERSION  = os.environ['VERSION']
          SHA256   = os.environ['SHA256']
          manifest = 'build-aux/io.github.todevelopers.GseProfiler.yml'
          with open(manifest) as f:
              content = f.read()
          content = re.sub(
              r'releases/download/v[0-9.]+/gseprofiler-[0-9.]+\.tar\.gz',
              f'releases/download/v{VERSION}/gseprofiler-{VERSION}.tar.gz',
              content
          )
          content = re.sub(
              r'(url: https://github\.com/todevelopers/gseprofiler/releases/download/v[^\n]+\n\s*sha256: )[^\n]+',
              lambda m: m.group(1) + SHA256,
              content
          )
          with open(manifest, 'w') as f:
              f.write(content)
          print(f'Updated manifest to v{VERSION} sha256={SHA256[:12]}...')
          PYEOF

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet build-aux/io.github.todevelopers.GseProfiler.yml; then
            git add build-aux/io.github.todevelopers.GseProfiler.yml
            git commit -m "chore: update Flatpak manifest to v${{ needs.version-bump.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder

      - name: Set up Flathub and install GNOME runtime (user)
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build Flatpak bundle
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          flatpak-builder \
            --disable-rofiles-fuse \
            --force-clean \
            --repo=repo \
            flatpak_app \
            build-aux/io.github.todevelopers.GseProfiler.yml
          flatpak build-bundle repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "gseprofiler-${VERSION}-x86_64.flatpak" \
            io.github.todevelopers.GseProfiler

      - name: Install org.flatpak.Builder for lint
        run: flatpak --user install -y flathub org.flatpak.Builder

      - name: Lint manifest
        continue-on-error: true
        run: >
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder
          manifest build-aux/io.github.todevelopers.GseProfiler.yml

      - name: Lint repo
        continue-on-error: true
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Attach Flatpak bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version-bump.outputs.version }}"
          files: "gseprofiler-${{ needs.version-bump.outputs.version }}-x86_64.flatpak"
